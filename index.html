<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quake Warning Lab</title>
<meta name="description" content="How can your phone warn you seconds before an earthquake's shaking arrives? Drop a quake and find out.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Quake Warning Lab</h1>
  <p class="lead">How can your phone buzz <em>before</em> the shaking starts? Click the map to place an earthquake, then press <b>Play</b>.</p>
</header>

<main class="layout">
  <section class="stage">
    <canvas id="map" width="720" height="540" aria-label="Map: click to move the earthquake, drag the phone"></canvas>
    <div class="legend">
      <span><i class="dot quake"></i>earthquake</span>
      <span><i class="dot phone"></i>you (drag)</span>
      <span><i class="ring p"></i>P wave (fast)</span>
      <span><i class="ring s"></i>S wave (slow, strong)</span>
    </div>
    <figure class="tracebox">
      <figcaption>What the nearest seismometer records, and how it decides "this is an earthquake"</figcaption>
      <canvas id="trace" width="720" height="170" aria-label="Seismogram of the nearest station with its STA/LTA ratio"></canvas>
    </figure>
  </section>

  <aside class="panel">
    <div class="result" id="result" aria-live="polite"></div>
    <div id="falseAlarm" class="notice" hidden aria-live="polite"></div>

    <div class="controls">
      <button id="play" class="primary">▶ Play</button>
      <button id="truck" class="secondary" aria-pressed="false">🚚 Send a truck past the station</button>
      <label>Magnitude <output id="magOut"></output>
        <input id="mag" type="range" min="4" max="8.5" step="0.1" value="7">
      </label>
      <label>Depth (km) <output id="depthOut"></output>
        <input id="depth" type="range" min="5" max="100" step="1" value="15">
      </label>
      <label>Seconds of P wave before deciding <output id="pwinOut"></output>
        <input id="pwin" type="range" min="1" max="8" step="0.5" value="3">
        <span class="hint">Longer = surer magnitude estimate, but less warning.</span>
      </label>
      <label>Processing + network delay <output id="latOut"></output>
        <input id="lat" type="range" min="0.5" max="5" step="0.5" value="2">
        <span class="hint">Every second lost here is a second less for you.</span>
      </label>
      <label>Stations that must agree <output id="kstOut"></output>
        <input id="kst" type="range" min="1" max="4" step="1" value="2">
        <span class="hint">More stations = fewer false alarms, but a later alert.</span>
      </label>
    </div>

    <ol class="timeline" id="timeline"></ol>
  </aside>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
